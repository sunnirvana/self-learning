      <h1>第一次 AI 出模</h1>
      <p class="lede">目标：STL + 切片报错原文。不要打印。</p>
    </header>

    <ol class="tight">
      <li>Meshy → Image to 3D（或 TripoSR Demo）</li>
      <li>上传 <code>avatar6.jpg</code>（单图即可）</li>
      <li>生成；有 Refine 可开</li>
      <li>Download → <strong>STL</strong></li>
      <li>导入 Bambu / Orca / Prusa / Cura</li>
      <li>记录：报错原文，或「无报错 + 尺寸 mm」</li>
    </ol>

    <p class="win">背面是预测的。流形检查比网页预览重要。</p>

    <p>文档：<a href="https://www.meshy.ai/tutorials/photo-to-3d-printable-model">Meshy printable guide</a> · <a href="https://help.prusa3d.com/article/modeling-with-3d-printing-in-mind_164135">Prusa manifold</a></p>
